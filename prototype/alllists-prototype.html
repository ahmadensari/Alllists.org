<style>
/* LAYOUT CONCEPT: a register, not a feed. Ruled sections instead of stacked cards, tabular numbers,
   one accent, system fonts only so every page is light on a slow phone. Logical (start/end) CSS so
   right-to-left Urdu needs no second stylesheet. This block is the design system's token source. */
:root{
  /* colour: cool neutrals biased toward the blue accent */
  --paper:#f5f7fa; --surface:#ffffff; --ink:#101828; --ink-2:#475467; --rule:#d0d5dd;
  --accent:#1d4e89; --accent-ink:#ffffff; --lock:#eaecf0;
  --ok:#067647; --warn-bg:#fef0c7; --warn-ink:#7a2e0e; --bad:#b42318; --focus:#b54708;
  /* type: system stacks; Urdu falls back to a Naskh face */
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-xs:.8125rem; --t-sm:.9375rem; --t-md:1rem; --t-lg:1.125rem; --t-xl:1.375rem; --t-2xl:1.75rem;
  /* space on a 4px scale */
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem;
  --r:6px; --measure:68ch;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c111d; --surface:#131a29; --ink:#f2f4f7; --ink-2:#98a2b3; --rule:#2a3447;
    --accent:#84adff; --accent-ink:#0c111d; --lock:#1d2636;
    --ok:#47cd89; --warn-bg:#3a2a07; --warn-ink:#fec84b; --bad:#f97066; --focus:#fec84b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c111d; --surface:#131a29; --ink:#f2f4f7; --ink-2:#98a2b3; --rule:#2a3447;
  --accent:#84adff; --accent-ink:#0c111d; --lock:#1d2636;
  --ok:#47cd89; --warn-bg:#3a2a07; --warn-ink:#fec84b; --bad:#f97066; --focus:#fec84b; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--t-md)/1.55 var(--font);padding-block:0}
a{color:var(--accent);text-underline-offset:.15em}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:60rem;margin-inline:auto;padding-inline:var(--s4)}
h1{font-size:var(--t-2xl);line-height:1.2;margin:var(--s2) 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:var(--t-lg);line-height:1.3;margin:0 0 var(--s2)}
p{margin:0 0 var(--s3);max-width:var(--measure)}
.muted{color:var(--ink-2)} .small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:var(--t-sm)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* prototype controls and product header */
.proto{background:var(--warn-bg);color:var(--warn-ink);font-size:var(--t-sm)}
.proto .wrap{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;padding-block:var(--s2)}
.proto strong{margin-inline-end:var(--s2)}
.ctl{display:inline-flex;align-items:center;gap:var(--s2)}
.seg{display:inline-flex;border:1px solid currentColor;border-radius:var(--r);overflow:hidden}
.seg button{border:0;padding:var(--s1) var(--s3);background:transparent;color:inherit;font:inherit;cursor:pointer;min-height:2rem}
.seg button[aria-pressed="true"]{background:var(--warn-ink);color:var(--warn-bg);font-weight:600}
header.site{background:var(--surface);border-block-end:1px solid var(--rule)}
.site-row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;padding-block:var(--s3)}
.logo{font-weight:700;font-size:var(--t-xl);color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo b{color:var(--accent)}
.search{flex:1 1 100%;min-width:0;display:flex;gap:var(--s2)}
@media (min-width:700px){.search{flex:1 1 20rem}}
.search input{flex:1;min-width:0;padding:var(--s2) var(--s3);border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);color:var(--ink);font:inherit;min-height:2.75rem}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s2) var(--s3);min-height:2.75rem;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:2.25rem;padding:var(--s1) var(--s3);font-size:var(--t-sm)}
select{min-height:2.25rem;padding:var(--s1) var(--s2);border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit}
/* page parts */
nav.crumbs{font-size:var(--t-sm);color:var(--ink-2);padding-block:var(--s3) 0}
nav.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2)}
nav.crumbs li+li::before{content:"/";margin-inline-end:var(--s2);color:var(--rule)}
nav.crumbs a{color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2);margin:0 0 var(--s3);padding:0;list-style:none}
.tag{font-size:var(--t-xs);padding:.125rem var(--s2);border:1px solid var(--rule);border-radius:99px;color:var(--ink-2)}
.sec{border-block-start:1px solid var(--rule);padding-block:var(--s4)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:var(--s4);margin-block:var(--s4)}
.actions{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.share{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.menu{display:none;gap:var(--s2);margin-block-start:var(--s2);align-items:center}
.menu.open{display:flex;flex-wrap:wrap}
.spons{border:1px dashed var(--warn-ink);background:var(--warn-bg);color:var(--warn-ink);padding:var(--s3);border-radius:var(--r);margin-block:var(--s4);font-size:var(--t-sm)}
.ad{border:1px dashed var(--rule);background:var(--lock);color:var(--ink-2);padding:var(--s3);border-radius:var(--r);margin-block:var(--s4);font-size:var(--t-sm)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
th,td{text-align:start;padding:var(--s2) var(--s3);border-block-end:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:var(--t-xs)}
/* verification chips: shape and text carry meaning, never colour alone */
.chip{display:inline-block;font-size:var(--t-xs);padding:.1rem var(--s2);border-radius:99px;border:1px solid var(--ink-2);color:var(--ink);margin:2px 0;margin-inline-end:var(--s1);white-space:nowrap}
.chip.surveyor{border:2px solid var(--ok);color:var(--ok);font-weight:700}
.chip.owner{border:1px solid var(--ok);color:var(--ok);font-weight:600}
.chip.ai{border-style:dashed}
.chip.none{border-style:dotted;color:var(--ink-2)}
.chip.closed{border-color:var(--bad);color:var(--bad);font-weight:600}
.lock{display:inline-block;background:var(--lock);color:var(--ink-2);border:1px dashed var(--rule);border-radius:4px;padding:0 var(--s2);font-size:var(--t-xs)}
/* result rows */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:var(--s3);padding-block:var(--s3);border-block-end:1px solid var(--rule);align-items:start}
.row:last-child{border-block-end:0}
.row.closed{opacity:.7}
.row .nm{font-weight:600;text-decoration:none}
@media (max-width:700px){.row{grid-template-columns:minmax(0,1fr)}}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--s2) var(--s4);margin:0}
dl.facts dt{color:var(--ink-2)} dl.facts dd{margin:0}
@media (max-width:520px){dl.facts{grid-template-columns:minmax(0,1fr);gap:0}dl.facts dd{margin-block-end:var(--s2)}}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}}
.notice{border-inline-start:4px solid var(--bad);background:var(--lock);padding:var(--s3) var(--s4);margin-block:var(--s3);border-radius:var(--r)}
.empty{border:1px dashed var(--rule);border-radius:var(--r);padding:var(--s5);background:var(--surface)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:var(--s3)}
.sw{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;font-size:var(--t-xs)}
.sw i{display:block;height:2.5rem;border-block-end:1px solid var(--rule)}
.sw span{display:block;padding:var(--s1) var(--s2)}
footer.legal{border-block-start:1px solid var(--rule);margin-block-start:var(--s5);padding-block:var(--s4) var(--s6);font-size:var(--t-xs);color:var(--ink-2)}
.toast{position:fixed;inset-block-end:var(--s4);inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:var(--s2) var(--s4);border-radius:var(--r);display:none}
.toast.show{display:block}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

  s("planFree","free");s("planSub","sub");s("lblSearch","search");s("btnSearch","search");
  document.getElementById("q").placeholder=T("searchPh");
  document.getElementById("planFree").setAttribute("aria-pressed",String(state.plan==="free"));
  document.getElementById("planSub").setAttribute("aria-pressed",String(state.plan==="sub"));
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-btn]"),function(b){var k=b.getAttribute("data-theme-btn");b.textContent=T(k);b.setAttribute("aria-pressed",String(state.theme===k));});
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang-btn]"),function(b){b.setAttribute("aria-pressed",String(lang===b.getAttribute("data-lang-btn")));});
  document.getElementById("legal").innerHTML='Listings are shown as submitted and checked; they are not endorsements. <a href="#/remove">Privacy and opt-out</a> · <a href="#/report">'+esc(T("report"))+'</a> · Advertising is labelled · Sample data only. Share links are plain links: nothing loads from a social network until you click.';
}
function render(){
  var hash=location.hash||"#/list", html, m=hash.match(/^#\/entry\/(\w+)/);
  if(m)html=renderEntry(m[1]);
  else if(hash==="#/empty")html=renderEmpty();
  else if(hash==="#/system")html=renderSystem();
  else if(/^#\/(report|add|claim|edit|remove|steward)$/.test(hash))html=renderStub(hash.slice(2));
  else html=renderList();
  chrome(); document.getElementById("app").innerHTML=html; window.scrollTo(0,0);
  /* partly translated text: let each block set its own direction so English fragments keep their punctuation */
  if(lang==="ur"){Array.prototype.forEach.call(document.querySelectorAll("#app p, #app ul, #app dd, #app td"),function(el){if(!el.hasAttribute("dir"))el.setAttribute("dir","auto");});}
  Array.prototype.forEach.call(document.querySelectorAll("[data-native]"),function(b){if(navigator.share){b.hidden=false;}});
}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.className="toast show";setTimeout(function(){t.className="toast";},1800);}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("button"); if(!t)return;
  if(t.id==="planFree"){state.plan="free";render();return;}
  if(t.id==="planSub"){state.plan="sub";render();return;}
  if(t.hasAttribute("data-theme-btn")){state.theme=t.getAttribute("data-theme-btn");applyTheme();chrome();return;}
  if(t.hasAttribute("data-lang-btn")){lang=t.getAttribute("data-lang-btn");render();return;}
  if(t.hasAttribute("data-copy")){var u=t.getAttribute("data-copy");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast("Link copied");},function(){toast(u);});}else{toast(u);}return;}
  if(t.hasAttribute("data-native")){navigator.share({title:EN.title,url:CANON+"?utm_source=native&utm_medium=share&ref=DEMO"}).catch(function(){});return;}
  if(t.hasAttribute("data-more")){var key=t.getAttribute("data-more");var mm=document.getElementById("menu-"+key);var open=mm.classList.toggle("open");t.setAttribute("aria-expanded",String(open));return;}
  if(t.hasAttribute("data-outreach")){toast("Demo: opens the channel picker (WhatsApp first, opt-in, sent by AllLists)");return;}
  if(t.hasAttribute("data-quote")){toast("Demo: request-a-quote form");return;}
  if(t.hasAttribute("data-save")){toast("Demo: saved to your list (needs an account)");return;}
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="fl"){state.level=ev.target.value;render();}
  if(ev.target.id==="so"){state.sort=ev.target.value;render();}
  if(ev.target.id==="uv"){state.showUnverified=ev.target.checked;render();}
  if(ev.target.id==="cl"){state.showClosed=ev.target.checked;render();}
});
window.addEventListener("hashchange",render);
try{var st=localStorage.getItem("al-theme");if(st==="light"||st==="dark"){state.theme=st;applyTheme();}}catch(x){}
render();
</script>
</body>
</html>
