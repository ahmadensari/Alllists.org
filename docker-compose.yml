# Local development stack (plan P0.03). Throwaway credentials: local use only, never reuse them anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: alllists
      POSTGRES_USER: alllists
      POSTGRES_PASSWORD: alllists
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alllists"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
