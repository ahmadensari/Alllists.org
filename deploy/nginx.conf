# Alternative to Caddy. Put TLS (certbot or a CDN origin certificate) in front of this server block.
upstream alllists_app { server 127.0.0.1:8000; }
server {
    listen 80;
    server_name alllists.com www.alllists.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name alllists.com www.alllists.com;
    # ssl_certificate and ssl_certificate_key go here
    client_max_body_size 8m;
    location /static/ { alias /srv/alllists/current/backend/staticfiles/; expires 1y; add_header Cache-Control "public, immutable"; }
    location / {
        proxy_pass http://alllists_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
